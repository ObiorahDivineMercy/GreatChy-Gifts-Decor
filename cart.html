<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Your Cart | GreatChy Gifts & Decor</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">

                GreatChy

                <span>
                    Gifts & Decor
                </span>

            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#shop">
                        Shop
                    </a>
                </li>

                <li>
                    <a href="index.html#categories">
                        Categories
                    </a>
                </li>

                <li>
                    <a href="index.html#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart 🛒
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CART SECTION -->

    <main>

        <section class="cart-section">

            <div class="container">

                <h2>
                    Your Cart
                </h2>


                <div id="cart-items">
                    <!-- Cart items loaded by cart.js -->
                </div>


                <!-- CART SUMMARY -->

                <div class="cart-summary">

                    <h3>
                        Cart Summary
                    </h3>


                    <p>

                        Total:

                        <span id="cart-total">
                            ₦0
                        </span>

                    </p>


                    <div class="cart-buttons">

                        <a
                            href="index.html#shop"
                            class="continue-btn">

                            Continue Shopping

                        </a>


                        <a
                            href="checkout.html"
                            class="checkout-btn">

                            Proceed to Checkout

                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/cart.js"></script>


</body>

</html>
