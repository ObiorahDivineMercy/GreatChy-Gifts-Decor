<nav class="navbar">
    <div class="container">
        <div class="logo">
            GreatChy
            <span>
                Gifts & Decor
            </span>
        </div>
        <ul class="nav-links">
            <li>
                <a href="index.html">

        </ul>

<!--  CHECKOUT SECTION  -->
<section class="checkout-section">
<div class="container">
<h2>
    Complete Your Order
</h2>
<div class="checkout-container">

<!-- CUSTOMER DETAILS -->
<div class="checkout-form">
<h3>
    Customer Information
</h3>
<form id="checkout-form">
<input 
type="text" 
placeholder="Full Name">
<input 
type="tel" 
placeholder="Phone Number">
<input 
type="email" 
placeholder="Email Address">

<textarea 
placeholder="Delivery Address">
</textarea>

<h3>
    Payment Method
</h3>

<div class="payment-options">

    <label class="payment-option">
        <input 
        type="radio" 
        name="payment">
        <span>
            Bank Transfer
        </span>

    </label>

    <label class="payment-option">
        <input 
        type="radio" 
        name="payment">

        <span>
            Cash on Delivery
        </span>

    </label>

</div>
<button type="submit">

    Place Order 🎁
</button>


</form>
</div>

<!-- ORDER SUMMARY -->
<div class="order-summary">
<h3>
    Your Order
</h3>

<div id="checkout-items">

</div>

<div class="checkout-total">

<h3>
Total:
<span id="checkout-total">
₦0
</span>
</h3>
</div>
</div>
</div>
</div>
</section>

<script src="js/checkout.js"></script>
</body>

</html>
